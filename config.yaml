logging:
  level: INFO

message_queue:
  backend: memory
  nats:
    servers:
      - nats://127.0.0.1:4222
    stream: snn_events
    subject: training.events
    durable: snn-worker
    connect: true
    timeout: 2.0
    allow_reconnect: true

training_worker:
  mode: tstep  # 可设为 tstep 或 fpt
  data:
    root: .data/datasets/mnist
    train: train.npz
    val: val.npz
    inputs_key: x
    labels_key: y
  network:
    input_dim: 784
    hidden_dim: 256
    output_dim: 10
  hyperparams:
    epochs: 10
    batch_size: 64
    lr: 0.001
    scheduler:
      type: cosine
      warmup_steps: 100
    weight_decay: 0.0
    truncation_steps: 4
    timesteps: 16
    seed: 42
    grad_clip: 1.0
    temperature:
      value: 1.0
      learnable: false
    logit_scale:
      value: 1.25
      learnable: false
    logit_scale_init: 1.60
    logit_scale_min: 0.5
    logit_scale_max: 3.0
    logit_scale_learnable: true
    optimizer:
      type: adamw
      head_lr: 0.003
      rec_lr: 0.001
      betas: [0.9, 0.999]
      eps: 1.0e-08
      weight_decay: 0.0
    scheduler:
      restarts: null
    head_hidden: 64
    head_momentum: 0.9
    unfreeze_at_conf: 0.0
    solver:
      type: anderson
      anderson_m: 4
      anderson_beta: 0.5
      K_schedule: auto
    rate_reg_lambda: 0.001
    rate_target: 0.2
    tstep_regularization:
      rate_reg_lambda: 0.001
      rate_target: 0.2
    g_apical:
      start: 0.5
      end: 0.2
    beta:
      start: 0.035
      end: 0.03
    v_th:
      start: -0.053
      end: -0.055
  neuron:
    dt: 0.001
    tau_soma: 0.02
    tau_apical: 0.03
    tau_basal: 0.03
    coupling_apical: 0.6
    coupling_basal: 0.6
    threshold: -0.054
    v_rest: -0.07
  nats:
    servers:
      - nats://127.0.0.1:4222
    stream: snn_training
    timeout: 2.0
    subjects:
      metrics: snn.metrics.training
      spikes: snn.spikes.layer
      logs: snn.ui.log.training

training_service:
  dataset: MNIST
  mode: fpt
  network_size: 128
  layers: 2
  epochs: 60
  lr: 0.001
  scheduler: warmup_cosine
  warmup_steps: 200
  min_lr_scale: 0.2
  min_lr: null
  weight_decay: 0.0001
  grad_clip: 1.0
  K: 10
  tol: 5.0e-6
  T: 12
  solver: anderson
  anderson_m: 10
  anderson_beta: 0.5
  anderson_ridge: 1.0e-4
  line_search: true
  fp_err_guard: 0.1
  K_schedule: auto
  temperature: 1.0
  logit_scale: 2.0
  logit_scale_learnable: true
  logit_scale_init: 2.00
  logit_scale_min: 0.5
  logit_scale_max: 6.0
  fp_damping: 0.9
  tstep_regularization:
    rate_reg_lambda: 0.001
    rate_target: 0.2
  rate_reg_lambda: 0.001
  rate_target: 0.2
  augment: false
  head_hidden: 256
  head_momentum: 0.9
  unfreeze_at_conf: 0.0
  ema_decay: 0.999

train:
  dataset: MNIST
  mode: fpt
  batch_size: 256
  steps_per_epoch: 0          # 0 -> ceil(N/batch)
  augment: false

  epochs: 60
  head_hidden: 256
  head_ln: true
  head_dropout: 0.00
  learn_logit_scale: true
  logit_scale_init: 2.00
  logit_scale_min: 0.50
  logit_scale_max: 6.00
  unfreeze_at_conf: 0.0

  optimizer: adamw
  head_lr: 0.003
  rec_lr: 0.001
  weight_decay_head: 1.0e-4
  weight_decay_rec:  1.0e-4
  grad_clip: 1.0

  scheduler: warmup_cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.07

  solver: anderson
  K: 10
  anderson_m: 10
  anderson_beta: 0.5
  anderson_ridge: 1.0e-4
  line_search: true
  tol: 1.0e-5
  fp_err_guard: 1.0e-1
  spectral_rho: 0.90
  lambda_contr: 1.0e-4
  fp_damping: 0.90
  rho_max: 0.9

  rate_reg_lambda: 1.0e-3
  rate_target: 0.20
  g_apical_start: 0.5
  g_apical_end: 0.2
  beta_start: 5.0
  beta_end: 6.0
  vth_start: 0.50
  vth_end: 0.55

  val_max_steps: 0        # 0 表示全量
  ema_decay: 0.999
  label_smoothing: 0.00
data:
  root: .data/datasets
